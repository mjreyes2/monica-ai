<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monica Holographic Globe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #globe-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        #search-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            gap: 10px;
        }
        #search-input {
            width: 300px;
            padding: 12px 20px;
            border: 2px solid #06b6d4;
            border-radius: 25px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-size: 16px;
            outline: none;
            backdrop-filter: blur(10px);
        }
        #search-input::placeholder {
            color: #888;
        }
        #search-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
        }
        #search-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        #search-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.7);
        }
        #info-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #06b6d4;
            border-radius: 15px;
            padding: 20px;
            color: #fff;
            backdrop-filter: blur(10px);
            max-width: 350px;
            z-index: 100;
        }
        #info-panel h2 {
            color: #06b6d4;
            margin-bottom: 10px;
            font-size: 24px;
        }
        #info-panel p {
            color: #ccc;
            line-height: 1.6;
        }
        .highlight-marker {
            position: absolute;
            width: 20px;
            height: 20px;
            background: radial-gradient(circle, #ffff00 0%, rgba(255, 255, 0, 0.5) 50%, transparent 70%);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
            pointer-events: none;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(2); opacity: 0.5; }
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #06b6d4;
            font-size: 24px;
            z-index: 1000;
        }
        .controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
        }
        .control-btn {
            width: 50px;
            height: 50px;
            border: 2px solid #06b6d4;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.7);
            color: #06b6d4;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .control-btn:hover {
            background: #06b6d4;
            color: #000;
        }
    </style>
</head>
<body>
    <div id="loading">Loading Globe...</div>
    <div id="globe-container"></div>
    
    <div id="search-container">
        <input type="text" id="search-input" placeholder="Ask Monica about any city..." />
        <button id="search-btn">🔍 Search</button>
    </div>
    
    <div id="info-panel">
        <h2>🌍 Monica Globe</h2>
        <p>Search for any city or country to zoom in and highlight it with a yellow marker.</p>
        <p id="location-info"></p>
    </div>
    
    <div class="controls">
        <button class="control-btn" id="zoom-in">+</button>
        <button class="control-btn" id="zoom-out">−</button>
        <button class="control-btn" id="reset">⟲</button>
    </div>

        let scene, camera, renderer, globe, controls;
        let markers = [];
        let arcs = [];
        let highlightedCity = null;

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 2.5;

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('globe-container').appendChild(renderer.domElement);

            // Lights
            const ambientLight = new THREE.AmbientLight(0x38bdf8, 0.6);
            scene.add(ambientLight);

            const directionalLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight1.position.set(-1, 1, 1);
            scene.add(directionalLight1);

            const directionalLight2 = new THREE.DirectionalLight(0xffffff, 0.5);
            directionalLight2.position.set(1, -1, -1);
            scene.add(directionalLight2);

            const pointLight = new THREE.PointLight(0xffffff, 1, 100);
            pointLight.position.set(5, 5, 5);
            scene.add(pointLight);

            // Create globe
            createGlobe();

            // Create atmosphere
            createAtmosphere();

            // Add sample arcs
            createSampleArcs();

            // Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.rotateSpeed = 0.5;
            controls.minDistance = 1.5;
            controls.maxDistance = 5;
            controls.autoRotate = globeConfig.autoRotate;
            controls.autoRotateSpeed = globeConfig.autoRotateSpeed;

            // Hide loading
            document.getElementById('loading').style.display = 'none';

            // Event listeners
            setupEventListeners();

            // Animation loop
            animate();
        }

        function createGlobe() {
            // Earth texture with terrain
            const textureLoader = new THREE.TextureLoader();
            
            // Create globe geometry
            const geometry = new THREE.SphereGeometry(1, 64, 64);
            
            // Load Earth textures
            const earthTexture = textureLoader.load(
                'https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg',
                () => console.log('Earth texture loaded'),
                undefined,
                () => {
                    // Fallback: create procedural texture
                    console.log('Using fallback texture');
                }
            );
            
            const bumpMap = textureLoader.load(
                'https://unpkg.com/three-globe/example/img/earth-topology.png'
            );

            const material = new THREE.MeshPhongMaterial({
                map: earthTexture,
                bumpMap: bumpMap,
                bumpScale: 0.05,
                specular: new THREE.Color(0x333333),
                shininess: 25,
            });

            globe = new THREE.Mesh(geometry, material);
            scene.add(globe);

            // Add country borders/grid
            const gridGeometry = new THREE.SphereGeometry(1.002, 36, 18);
            const gridMaterial = new THREE.MeshBasicMaterial({
                color: 0x06b6d4,
                wireframe: true,
                transparent: true,
                opacity: 0.1,
            });
            const grid = new THREE.Mesh(gridGeometry, gridMaterial);
            scene.add(grid);
        }

        function createAtmosphere() {
            const atmosphereGeometry = new THREE.SphereGeometry(1.15, 64, 64);
            const atmosphereMaterial = new THREE.ShaderMaterial({
                vertexShader: `
                    varying vec3 vNormal;
                    void main() {
                        vNormal = normalize(normalMatrix * normal);
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    varying vec3 vNormal;
                    void main() {
                        float intensity = pow(0.7 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 2.0);
                        gl_FragColor = vec4(0.3, 0.6, 1.0, 1.0) * intensity;
                    }
                `,
                blending: THREE.AdditiveBlending,
                side: THREE.BackSide,
                transparent: true,
            });
            const atmosphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
            scene.add(atmosphere);
        }

        function createSampleArcs() {
            const arcData = [
                { start: cities["new york"], end: cities["london"], color: 0x06b6d4 },
                { start: cities["london"], end: cities["tokyo"], color: 0x3b82f6 },
                { start: cities["tokyo"], end: cities["sydney"], color: 0x6366f1 },
                { start: cities["sydney"], end: cities["singapore"], color: 0x06b6d4 },
                { start: cities["singapore"], end: cities["dubai"], color: 0x3b82f6 },
                { start: cities["dubai"], end: cities["paris"], color: 0x6366f1 },
                { start: cities["paris"], end: cities["new york"], color: 0x06b6d4 },
                { start: cities["los angeles"], end: cities["hong kong"], color: 0x3b82f6 },
                { start: cities["hong kong"], end: cities["mumbai"], color: 0x6366f1 },
                { start: cities["mumbai"], end: cities["cairo"], color: 0x06b6d4 },
            ];

            arcData.forEach(arc => {
                if (arc.start && arc.end) {
                    createArc(arc.start, arc.end, arc.color);
                }
            });
        }

        function latLngToVector3(lat, lng, radius = 1.01) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lng + 180) * (Math.PI / 180);
            
            return new THREE.Vector3(
                -radius * Math.sin(phi) * Math.cos(theta),
                radius * Math.cos(phi),
                radius * Math.sin(phi) * Math.sin(theta)
            );
        }

        function createArc(start, end, color) {
            const startVec = latLngToVector3(start.lat, start.lng);
            const endVec = latLngToVector3(end.lat, end.lng);
            
            // Calculate midpoint with altitude
            const midPoint = new THREE.Vector3().addVectors(startVec, endVec).multiplyScalar(0.5);
            const distance = startVec.distanceTo(endVec);
            midPoint.normalize().multiplyScalar(1 + distance * 0.3);
            
            // Create curve
            const curve = new THREE.QuadraticBezierCurve3(startVec, midPoint, endVec);
            const points = curve.getPoints(50);
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            
            const material = new THREE.LineBasicMaterial({
                color: color,
                transparent: true,
                opacity: 0.6,
                linewidth: 2,
            });
            
            const arc = new THREE.Line(geometry, material);
            scene.add(arc);
            arcs.push(arc);
        }

        function createMarker(lat, lng, color = 0xffff00, size = 0.03) {
            const position = latLngToVector3(lat, lng, 1.02);
            
            // Glowing sphere marker
            const geometry = new THREE.SphereGeometry(size, 16, 16);
            const material = new THREE.MeshBasicMaterial({
                color: color,
                transparent: true,
                opacity: 0.9,
            });
            const marker = new THREE.Mesh(geometry, material);
            marker.position.copy(position);
            scene.add(marker);
            
            // Outer glow ring
            const ringGeometry = new THREE.RingGeometry(size * 1.5, size * 2.5, 32);
            const ringMaterial = new THREE.MeshBasicMaterial({
                color: color,
                transparent: true,
                opacity: 0.5,
                side: THREE.DoubleSide,
            });
            const ring = new THREE.Mesh(ringGeometry, ringMaterial);
            ring.position.copy(position);
            ring.lookAt(new THREE.Vector3(0, 0, 0));
            scene.add(ring);
            
            // Pulse animation
            const pulseRing = ring.clone();
            pulseRing.material = ringMaterial.clone();
            scene.add(pulseRing);
            
            markers.push({ marker, ring, pulseRing, lat, lng });
            
            return { marker, ring, pulseRing };
        }

        function clearMarkers() {
            markers.forEach(m => {
                scene.remove(m.marker);
                scene.remove(m.ring);
                scene.remove(m.pulseRing);
            });
            markers = [];
        }

        function searchCity(query) {
            const searchTerm = query.toLowerCase().trim();
            
            // Search in cities database
            let found = null;
            for (const [key, city] of Object.entries(cities)) {
                if (key.includes(searchTerm) || city.name.toLowerCase().includes(searchTerm) || 
                    city.country.toLowerCase().includes(searchTerm)) {
                    found = city;
                    break;
                }
            }
            
            if (found) {
                highlightCity(found);
                return true;
            } else {
                // Try geocoding API
                geocodeCity(query);
                return false;
            }
        }

        async function geocodeCity(query) {
            try {
                const response = await fetch(
                    `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`
                );
                const data = await response.json();
                
                if (data && data.length > 0) {
                    const result = data[0];
                    const city = {
                        lat: parseFloat(result.lat),
                        lng: parseFloat(result.lon),
                        name: result.display_name.split(',')[0],
                        country: result.display_name.split(',').pop().trim()
                    };
                    highlightCity(city);
                } else {
                    document.getElementById('location-info').innerHTML = 
                        `<span style="color: #ff6b6b;">Location "${query}" not found. Try another search.</span>`;
                }
            } catch (error) {
                console.error('Geocoding error:', error);
                document.getElementById('location-info').innerHTML = 
                    `<span style="color: #ff6b6b;">Error searching for location.</span>`;
            }
        }

        function highlightCity(city) {
            // Clear previous markers
            clearMarkers();
            
            // Create yellow highlight marker
            createMarker(city.lat, city.lng, 0xffff00, 0.04);
            
            // Zoom to city
            zoomToLocation(city.lat, city.lng);
            
            // Update info panel
            document.getElementById('location-info').innerHTML = `
                <strong style="color: #ffff00; font-size: 18px;">📍 ${city.name}</strong><br>
                <span style="color: #06b6d4;">${city.country}</span><br>
                <span style="color: #888;">Lat: ${city.lat.toFixed(4)}, Lng: ${city.lng.toFixed(4)}</span>
            `;
            
            highlightedCity = city;
            
            // Stop auto-rotation temporarily
            controls.autoRotate = false;
            setTimeout(() => {
                controls.autoRotate = globeConfig.autoRotate;
            }, 5000);
        }

        function zoomToLocation(lat, lng) {
            const targetPosition = latLngToVector3(lat, lng, 2.2);
            
            // Animate camera
            const startPosition = camera.position.clone();
            const duration = 1500;
            const startTime = Date.now();
            
            function animateCamera() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easeProgress = 1 - Math.pow(1 - progress, 3); // Ease out cubic
                
                camera.position.lerpVectors(startPosition, targetPosition, easeProgress);
                camera.lookAt(0, 0, 0);
                
                if (progress < 1) {
                    requestAnimationFrame(animateCamera);
                }
            }
            
            animateCamera();
        }

        function setupEventListeners() {
            // Search
            const searchInput = document.getElementById('search-input');
            const searchBtn = document.getElementById('search-btn');
            
            searchBtn.addEventListener('click', () => {
                const query = searchInput.value;
                if (query) searchCity(query);
            });
            
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const query = searchInput.value;
                    if (query) searchCity(query);
                }
            });
            
            // Zoom controls
            document.getElementById('zoom-in').addEventListener('click', () => {
                camera.position.multiplyScalar(0.8);
            });
            
            document.getElementById('zoom-out').addEventListener('click', () => {
                camera.position.multiplyScalar(1.2);
            });
            
            document.getElementById('reset').addEventListener('click', () => {
                camera.position.set(0, 0, 2.5);
                controls.reset();
                clearMarkers();
                document.getElementById('location-info').innerHTML = '';
            });
            
            // Window resize
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            
            // Listen for messages from Monica
            window.addEventListener('message', (event) => {
                if (event.data && event.data.type === 'search') {
                    searchCity(event.data.query);
                }
            });
        }

        let pulseTime = 0;
        function animate() {
            requestAnimationFrame(animate);
            
            // Rotate globe slightly
            if (globe) {
                globe.rotation.y += 0.001;
            }
            
            // Animate markers
            pulseTime += 0.05;
            markers.forEach(m => {
                if (m.pulseRing) {
                    const scale = 1 + Math.sin(pulseTime) * 0.3;
                    m.pulseRing.scale.set(scale, scale, scale);
                    m.pulseRing.material.opacity = 0.5 - Math.sin(pulseTime) * 0.3;
                }
            });
            
            controls.update();
            renderer.render(scene, camera);
        }

        // Initialize
        init();

        // Expose search function for Monica integration
        window.monicaSearchCity = searchCity;
    </script>
</body>
</html>
