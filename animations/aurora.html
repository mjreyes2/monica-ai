<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora Borealis - Green Screen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #00ff00; /* Green screen for chroma key */
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        
        .aurora-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .aurora {
            position: absolute;
            width: 200%;
            height: 60%;
            top: 0;
            left: -50%;
            background: linear-gradient(
                180deg,
                transparent 0%,
                rgba(0, 255, 150, 0.3) 20%,
                rgba(0, 200, 255, 0.4) 40%,
                rgba(100, 0, 255, 0.3) 60%,
                rgba(255, 0, 150, 0.2) 80%,
                transparent 100%
            );
            filter: blur(30px);
            animation: aurora-wave 8s ease-in-out infinite;
            mix-blend-mode: screen;
        }
        
        .aurora:nth-child(2) {
            animation-delay: -2s;
            animation-duration: 10s;
            opacity: 0.7;
        }
        
        .aurora:nth-child(3) {
            animation-delay: -4s;
            animation-duration: 12s;
            opacity: 0.5;
        }
        
        .aurora:nth-child(4) {
            animation-delay: -6s;
            animation-duration: 6s;
            opacity: 0.8;
            background: linear-gradient(
                180deg,
                transparent 0%,
                rgba(0, 255, 200, 0.4) 30%,
                rgba(100, 200, 255, 0.5) 50%,
                rgba(200, 100, 255, 0.3) 70%,
                transparent 100%
            );
        }
        
        @keyframes aurora-wave {
            0%, 100% {
                transform: translateX(-10%) skewX(-5deg) scaleY(1);
            }
            25% {
                transform: translateX(5%) skewX(5deg) scaleY(1.2);
            }
            50% {
                transform: translateX(10%) skewX(-3deg) scaleY(0.8);
            }
            75% {
                transform: translateX(-5%) skewX(3deg) scaleY(1.1);
            }
        }
        
        /* Vertical light rays */
        .ray {
            position: absolute;
            width: 3px;
            height: 100%;
            top: 0;
            background: linear-gradient(
                180deg,
                rgba(100, 255, 200, 0.8) 0%,
                rgba(100, 200, 255, 0.5) 30%,
                rgba(150, 100, 255, 0.3) 60%,
                transparent 100%
            );
            filter: blur(3px);
            animation: ray-pulse 4s ease-in-out infinite;
        }
        
        @keyframes ray-pulse {
            0%, 100% {
                opacity: 0.3;
                transform: scaleY(0.8);
            }
            50% {
                opacity: 0.8;
                transform: scaleY(1);
            }
        }
    </style>
</head>
<body>
    <div class="aurora-container">
        <div class="aurora"></div>
        <div class="aurora"></div>
        <div class="aurora"></div>
        <div class="aurora"></div>
    </div>
    
    <script>
        const container = document.querySelector('.aurora-container');
        
        // Create vertical light rays
        for (let i = 0; i < 30; i++) {
            const ray = document.createElement('div');
            ray.className = 'ray';
            ray.style.left = (Math.random() * 100) + '%';
            ray.style.animationDelay = (Math.random() * 4) + 's';
            ray.style.animationDuration = (Math.random() * 3 + 3) + 's';
            ray.style.opacity = Math.random() * 0.5 + 0.2;
            container.appendChild(ray);
        }
    </script>
</body>
</html>
