<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starfield Animation - Green Screen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #00ff00; /* Green screen for chroma key */
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        
        .starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite;
            box-shadow: 0 0 10px 2px rgba(255, 255, 255, 0.8);
        }
        
        @keyframes twinkle {
            0%, 100% {
                opacity: 0.3;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.5);
            }
        }
        
        /* Shooting stars */
        .shooting-star {
            position: absolute;
            width: 4px;
            height: 4px;
            background: linear-gradient(45deg, white, transparent);
            border-radius: 50%;
            animation: shoot linear infinite;
            box-shadow: 0 0 20px 4px rgba(255, 255, 255, 0.9);
        }
        
        @keyframes shoot {
            0% {
                transform: translateX(0) translateY(0);
                opacity: 1;
            }
            100% {
                transform: translateX(500px) translateY(500px);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="starfield" id="starfield"></div>
    
    <script>
        const starfield = document.getElementById('starfield');
        
        // Create regular stars
        for (let i = 0; i < 200; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.width = (Math.random() * 4 + 1) + 'px';
            star.style.height = star.style.width;
            star.style.setProperty('--duration', (Math.random() * 3 + 1) + 's');
            star.style.animationDelay = Math.random() * 3 + 's';
            starfield.appendChild(star);
        }
        
        // Create shooting stars periodically
        function createShootingStar() {
            const star = document.createElement('div');
            star.className = 'shooting-star';
            star.style.left = Math.random() * 50 + '%';
            star.style.top = Math.random() * 50 + '%';
            star.style.animationDuration = (Math.random() * 1 + 0.5) + 's';
            starfield.appendChild(star);
            
            // Remove after animation
            setTimeout(() => star.remove(), 2000);
        }
        
        // Create shooting star every 2-5 seconds
        setInterval(createShootingStar, Math.random() * 3000 + 2000);
        createShootingStar(); // Initial one
    </script>
</body>
</html>
