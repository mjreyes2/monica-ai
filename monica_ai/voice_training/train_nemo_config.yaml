# NeMo ASR Fine-tuning Configuration for Monica Voice Training
name: monica_voice_asr

model:
  sample_rate: 16000
  log_prediction: true  # Log predictions during training

  train_ds:
    manifest_filepath: data/training/recordings/wake_phrases/train_manifest.json
    sample_rate: 16000
    batch_size: 4
    shuffle: true
    num_workers: 4
    pin_memory: true
    trim_silence: false
    max_duration: 20.0
    min_duration: 0.1

  validation_ds:
    manifest_filepath: data/training/recordings/wake_phrases/val_manifest.json
    sample_rate: 16000
    batch_size: 4
    shuffle: false
    num_workers: 4
    pin_memory: true

  optim:
    name: adam
    lr: 0.0001
    betas: [0.9, 0.999]
    weight_decay: 0.0001

    sched:
      name: CosineAnnealing
      warmup_steps: null
      warmup_ratio: 0.05
      min_lr: 0.00001

trainer:
  devices: 1
  accelerator: gpu
  max_epochs: 50
  max_steps: -1
  num_nodes: 1
  accumulate_grad_batches: 1
  gradient_clip_val: 0.0
  precision: 32
  log_every_n_steps: 10
  check_val_every_n_epoch: 5
  enable_progress_bar: true
  logger: false

  callbacks:
    - class_path: pytorch_lightning.callbacks.ModelCheckpoint
      init_args:
        dirpath: models/nemo_personal/checkpoints
        filename: monica_voice_{epoch:02d}
        save_top_k: -1
        every_n_epochs: 10

exp_manager:
  exp_dir: models/nemo_personal
  name: monica_voice
  create_tensorboard_logger: false
  create_checkpoint_callback: true
  checkpoint_callback_params:
    monitor: val_loss
    mode: min
    save_top_k: 3
    always_save_nemo: true
