[package]
name = "monica_audio_accel"
version = "1.0.0"
edition = "2021"
authors = ["Monica AI"]
description = "High-performance audio pipeline for Monica AI — resampling, ring buffer, mixing"

[lib]
name = "monica_audio_accel"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
numpy = "0.22"
rubato = "0.16"          # High-quality audio resampling
dasp_ring_buffer = "0.11" # Lock-free ring buffer
rayon = "1.10"            # Parallel iterators

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
